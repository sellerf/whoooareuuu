<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="Status em tempo real dos serviços Linarc Team.">
  <title>Linarc Status</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop stop-color='%23ff8293'/%3E%3Cstop offset='1' stop-color='%23ff3855'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='29' fill='url(%23g)'/%3E%3Cpath d='M25 17h8v23h13v7H25z' fill='%2309090b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#101014;--line:#ffffff16;--muted:#85838c;--red:#ff3855;--green:#9ee6b9;--amber:#ffd18b;font-family:'Space Grotesk',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 80% 15%,#ff385512,transparent 38%),var(--bg);color:#f5f4f2;overflow:hidden}.grid{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(120deg,transparent,#000 90%);opacity:.38}.glow{position:fixed;width:360px;height:360px;right:-120px;top:30%;background:#ff38551a;filter:blur(100px);pointer-events:none}.shell{position:relative;width:min(1120px,100%);height:100svh;margin:auto;padding:32px 44px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.12em;font-size:13px}.mark{height:34px;width:34px;display:grid;place-items:center;background:var(--red);color:#10080a;font-size:18px;font-weight:700;border-radius:3px;box-shadow:0 0 28px #ff38554a}.brand small{font:11px 'DM Mono',monospace;color:var(--red);margin-left:4px}.live{font:10px 'DM Mono',monospace;letter-spacing:.14em;color:var(--muted);display:flex;align-items:center;gap:9px}.live i,.dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 12px #9ee6b9aa;display:inline-block}.live i{animation:pulse 1.8s infinite}.intro{padding:38px 0 24px;display:flex;justify-content:space-between;align-items:end;gap:24px}.eyebrow{font:10px 'DM Mono',monospace;letter-spacing:.17em;text-transform:uppercase;color:#ff8293;margin:0 0 12px}.intro h1{margin:0;font-size:clamp(34px,5vw,56px);line-height:.95;letter-spacing:-.07em}.intro h1 span{color:var(--red)}.summary{text-align:right;color:var(--muted);font:11px 'DM Mono',monospace;line-height:1.8;white-space:nowrap}.summary strong{color:var(--green);font-weight:500}.services{display:grid;grid-template-columns:1fr 1fr;gap:10px}.service{position:relative;min-height:126px;background:linear-gradient(115deg,#121216,#0e0e12);border:1px solid var(--line);padding:18px 20px;overflow:hidden;transition:border-color .3s,transform .3s}.service:hover{border-color:#ff38555c;transform:translateY(-2px)}.service:after{content:"";position:absolute;inset:auto 0 0;height:1px;background:linear-gradient(90deg,transparent,var(--tone),transparent);opacity:.7}.service-head{display:flex;align-items:center;justify-content:space-between}.service-name{font-size:16px;font-weight:600;letter-spacing:-.03em}.service-state{font:9px 'DM Mono',monospace;letter-spacing:.12em;color:var(--tone);display:flex;align-items:center;gap:7px}.service-state .dot{background:var(--tone);box-shadow:0 0 10px color-mix(in srgb,var(--tone),transparent 25%)}.service.down .dot{animation:pulse .9s infinite}.service-url{font:10px 'DM Mono',monospace;color:var(--muted);margin-top:6px}.uptime{height:19px;display:flex;gap:3px;margin-top:17px}.uptime span{flex:1;border-radius:1px;background:#9ee6b9;opacity:.84;transition:height .3s;align-self:end;height:12px}.uptime span.out{background:#ff536b;opacity:1}.uptime span.unknown{background:#ffffff1a}.uptime span:nth-child(3n){height:17px}.uptime span:nth-child(4n){height:9px}.uptime span.today{box-shadow:0 0 8px #9ee6b977}.uptime-labels{display:flex;justify-content:space-between;margin-top:5px;color:#66646d;font:8px 'DM Mono',monospace}.bottom{margin-top:auto;padding-top:22px;display:flex;align-items:center;justify-content:space-between;gap:15px;color:var(--muted);font:10px 'DM Mono',monospace}.bottom strong{color:#e8e6e8;font-weight:400}.refresh{display:flex;align-items:center;gap:8px}.refresh svg{animation:spin 2s linear infinite;animation-play-state:paused}.refresh.checking svg{animation-play-state:running}.legend{display:flex;gap:12px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:6px;height:6px;border-radius:50%;background:var(--green)}.legend .red{background:#ff536b}.service.down{--tone:#ff536b!important;border-color:#ff536b4d}.service.wait{--tone:var(--amber)!important}.service{--tone:var(--green)}
    @keyframes pulse{50%{opacity:.45;box-shadow:0 0 3px currentColor}}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:620px){.shell{padding:20px 18px}.top{padding-bottom:16px}.intro{padding:30px 0 18px;display:block}.intro h1{font-size:42px}.summary{text-align:left;margin-top:12px}.services{gap:8px}.service{padding:14px;min-height:119px}.service-name{font-size:14px}.service-url{font-size:9px}.uptime{gap:2px;margin-top:15px}.uptime-labels{font-size:7px}.bottom{align-items:flex-end}.legend{gap:8px}.bottom{font-size:9px}}@media(max-width:380px){.shell{padding:15px 12px}.intro h1{font-size:36px}.service{padding:12px;min-height:114px}.service-name{font-size:13px}.uptime{margin-top:12px}.live{font-size:8px}.legend{gap:5px}.bottom{font-size:8px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div><div class="glow" aria-hidden="true"></div>
  <main class="shell">
    <header class="top"><div class="brand"><span class="mark">L</span><span>LINARC <small>/ STATUS</small></span></div></header>
    <section class="intro"><div><h1>Tudo funcionando.<br><span>Em tempo real.</span></h1></div><div class="summary" id="summary">VERIFICANDO SERVIÇOS<br><strong>conectando...</strong></div></section>
    <section class="services" id="services" aria-label="Status dos serviços"></section>
    <footer class="bottom"><div class="refresh" id="refresh"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.7-2L20 12M4 12l2.7 5a7 7 0 0 0 11.7-2"/></svg><span id="checked">Iniciando verificações</span></div></footer>
  </main>
  <script src="/status/status.js"></script>
</body>
</html>
